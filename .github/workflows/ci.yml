name: Python quality and PostgreSQL integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -m 'not integration' -v
      - run: python scripts/generate_source_ddl.py --check
      - run: python scripts/generate_mock_data.py --orders 80 --customers 20 --products 20 --output artifacts/generator-smoke
  integration:
    runs-on: ubuntu-latest
    # Ephemeral CI-only credential, supplied through environment; never a real account secret.
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: sales_profitability_test
      POSTGRES_USER: sales_app
      POSTGRES_PASSWORD: ephemeral_ci_only
      RUN_DB_TESTS: '1'
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: sales_profitability_test
          POSTGRES_USER: sales_app
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sales_app -d sales_profitability_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.lock.txt
      - run: pytest --cov=src --cov-report=term-missing -v
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run typecheck && npm run build
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  powerbi-artifacts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.lock.txt
      - run: python scripts/verify_powerbi.py
      - run: ./scripts/setup_powerbi_tools.ps1
      - run: ./scripts/verify_tmdl.ps1
