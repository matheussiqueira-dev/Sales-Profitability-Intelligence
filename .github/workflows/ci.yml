name: Python quality and PostgreSQL integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -m 'not integration' -v
  integration:
    runs-on: ubuntu-latest
    # Ephemeral CI-only credential, supplied through environment; never a real account secret.
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: sales_profitability_test
      POSTGRES_USER: sales_app
      POSTGRES_PASSWORD: ephemeral_ci_only
      RUN_DB_TESTS: '1'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sales_profitability_test
          POSTGRES_USER: sales_app
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sales_app -d sales_profitability_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.lock.txt
      - run: pytest --cov=src --cov-report=term-missing -v
